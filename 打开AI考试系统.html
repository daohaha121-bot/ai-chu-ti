<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能考试与活码管理系统 - 一键直达</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-main {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    }
    .btn-main:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.6);
    }
  </style>
</head>
<body class="text-slate-100 flex items-center justify-center p-4">
  <div class="max-w-xl w-full space-y-6 my-auto py-8">

    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white font-black text-2xl shadow-xl shadow-blue-500/30 mb-2">
        AI
      </div>
      <h1 class="text-3xl font-black tracking-tight text-white">AI 智能考试与活码管理系统</h1>
      <p class="text-sm text-slate-400">搬瓦工 VPS 云端 · 7×24小时 持续在线守护</p>
    </div>

    <!-- 服务器在线健康状态 -->
    <div class="glass-card p-4 rounded-2xl flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <div class="w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-lg shadow-emerald-500/50 animate-pulse"></div>
        <div>
          <div class="text-sm font-bold text-emerald-400">🟢 搬瓦工服务器运行正常 (24h 在线)</div>
          <div class="text-xs text-slate-400">IP: 67.216.203.127 | 端口: 8080</div>
        </div>
      </div>
      <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-mono border border-emerald-500/30">免证书拦截</span>
    </div>

    <!-- 核心一键进入主按钮 (无任何报错拦截，一键秒开) -->
    <div class="glass-card p-6 rounded-2xl space-y-5 border-blue-500/40 shadow-2xl">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-300 border border-blue-500/30">推荐主入口</span>
          <h2 class="text-xl font-bold text-white mt-2">点击直接进入后台管理系统</h2>
          <p class="text-xs text-slate-400 mt-1">直连公网高性能端口，无安全拦截弹窗，1秒进入</p>
        </div>
      </div>

      <a href="http://67.216.203.127:8080" target="_blank" class="block w-full py-4 rounded-xl font-bold text-center text-white text-base btn-main transition shadow-lg">
        🚀 立即打开系统后台 (http://67.216.203.127:8080)
      </a>
    </div>

    <!-- 备用入口 -->
    <div class="glass-card p-4 rounded-2xl flex items-center justify-between text-xs text-slate-300">
      <div>
        <span class="font-bold text-slate-200">备用 HTTPS 入口：</span>
        <a href="https://67.216.203.127" target="_blank" class="text-blue-400 hover:underline">https://67.216.203.127</a>
        <span class="text-slate-500 text-[10px] ml-1">(若提示不是私密连接，点左下角高级->继续前往即可)</span>
      </div>
      <button onclick="navigator.clipboard.writeText('http://67.216.203.127:8080'); alert('后台网址已复制到剪贴板！');" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">
        复制链接
      </button>
    </div>

  </div>
</body>
</html>
